name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/skyimage
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ===== 从 CHANGELOG.md 读取版本信息 =====
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      body: ${{ steps.parse.outputs.body }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Parse CHANGELOG.md
        id: parse
        run: |
          VERSION=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$VERSION" ]; then
            echo "❌ 未在 CHANGELOG.md 中找到有效的版本条目"
            echo "请在文件顶部添加格式如下的条目:"
            echo "## [0.3.0] - 2026-08-05"
            exit 1
          fi
          BODY=$(awk '/^## \[[0-9]/{if(f) exit} f{print} /^## \[[0-9]/{f=1}' CHANGELOG.md)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "body<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

  # ===== 前端构建 =====
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: dist
          retention-days: 1

  # ===== Docker 构建 =====
  build-docker:
    needs: changelog
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set GHCR image name (lowercase)
        run: echo "GHCR_IMAGE=${GHCR_IMAGE,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.31.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}

      - name: Compute version and platform suffix
        id: buildinfo
        run: |
          PLATFORM="${{ matrix.platform }}"
          echo "platform_suffix=${PLATFORM//\//-}" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.changelog.outputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.platform }}
          outputs: |
            type=image,name=${{ env.DOCKER_IMAGE }}:${{ steps.buildinfo.outputs.version }}-${{ steps.buildinfo.outputs.platform_suffix }},push=true
            type=image,name=${{ env.GHCR_IMAGE }}:${{ steps.buildinfo.outputs.version }}-${{ steps.buildinfo.outputs.platform_suffix }},push=true

      - name: Export tags
        run: |
          mkdir -p /tmp/tags/docker /tmp/tags/ghcr
          echo "${{ env.DOCKER_IMAGE }}:${{ steps.buildinfo.outputs.version }}-${{ steps.buildinfo.outputs.platform_suffix }}" > /tmp/tags/docker/${{ steps.buildinfo.outputs.platform_suffix }}
          echo "${{ env.GHCR_IMAGE }}:${{ steps.buildinfo.outputs.version }}-${{ steps.buildinfo.outputs.platform_suffix }}" > /tmp/tags/ghcr/${{ steps.buildinfo.outputs.platform_suffix }}

      - name: Upload tags
        uses: actions/upload-artifact@v6
        with:
          name: docker-tags-${{ strategy.job-index }}
          path: /tmp/tags/*
          if-no-files-found: error
          retention-days: 1

  # ===== Docker 合并 =====
  docker-merge:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    needs: [build-docker, changelog]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set GHCR image name (lowercase)
        run: echo "GHCR_IMAGE=${GHCR_IMAGE,,}" >> $GITHUB_ENV

      - name: Download tags
        uses: actions/download-artifact@v7
        with:
          path: /tmp/tags
          pattern: docker-tags-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.31.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAGS=""
          IS_RELEASE="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.changelog.outputs.version }}"
            TAGS="${{ env.DOCKER_IMAGE }}:${VERSION},${{ env.DOCKER_IMAGE }}:latest"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f1-2)
            TAGS="${TAGS},${{ env.DOCKER_IMAGE }}:${MAJOR},${{ env.DOCKER_IMAGE }}:${MINOR}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${{ env.DOCKER_IMAGE }}:${VERSION},${{ env.DOCKER_IMAGE }}:latest"
          fi
          GHCR_TAGS=$(echo "$TAGS" | sed "s|${{ env.DOCKER_IMAGE }}|${{ env.GHCR_IMAGE }}|g")
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=${GHCR_TAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT

      - name: Create Docker Hub manifest list and push
        working-directory: /tmp/tags/docker
        run: |
          TAGS_ARRAY=($(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '))
          TAG_ARGS=""
          for tag in "${TAGS_ARRAY[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $tag"
          done
          docker buildx imagetools create $TAG_ARGS $(cat *)

      - name: Create GHCR manifest and push
        working-directory: /tmp/tags/ghcr
        run: |
          TAGS_ARRAY=($(echo "${{ steps.tags.outputs.ghcr_tags }}" | tr ',' ' '))
          TAG_ARGS=""
          for tag in "${TAGS_ARRAY[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $tag"
          done
          docker buildx imagetools create $TAG_ARGS $(cat *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:${{ steps.tags.outputs.version }}

      - name: Update Docker Hub description
        if: steps.tags.outputs.is_release == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md

  # ===== 二进制构建 =====
  build-binaries:
    needs: [build-frontend, changelog]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o skyimage${{ matrix.suffix }} ./cmd/api

      - name: Package release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ needs.changelog.outputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          ARCHIVE_NAME="skyimage-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"

          mkdir -p "${ARCHIVE_NAME}"
          cp skyimage${{ matrix.suffix }} "${ARCHIVE_NAME}/"
          cp -r dist "${ARCHIVE_NAME}/"
          cp .env.example "${ARCHIVE_NAME}/.env.example"
          cp README.md "${ARCHIVE_NAME}/"
          mkdir -p "${ARCHIVE_NAME}/storage/uploads"
          mkdir -p "${ARCHIVE_NAME}/storage/data"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
            echo "ASSET=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
          else
            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            echo "ASSET=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ASSET }}
          retention-days: 1

  # ===== 发布 =====
  release:
    needs: [docker-merge, build-binaries, changelog]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set GHCR image name (lowercase)
        run: echo "GHCR_IMAGE=${GHCR_IMAGE,,}" >> $GITHUB_ENV

      - name: Download all binary artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ needs.changelog.outputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ needs.changelog.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release notes
        env:
          CHANGELOG: ${{ needs.changelog.outputs.body }}
        run: |
          if [ -n "$CHANGELOG" ]; then
            echo "### 更新日志" >> release_notes.md
            echo "" >> release_notes.md
            echo "$CHANGELOG" >> release_notes.md
            echo "" >> release_notes.md
          fi

          echo "### Docker 镜像" >> release_notes.md
          echo '```' >> release_notes.md
          echo "${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}" >> release_notes.md
          echo "${{ env.DOCKER_IMAGE }}:latest" >> release_notes.md
          echo "${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}" >> release_notes.md
          echo "${{ env.GHCR_IMAGE }}:latest" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md

          echo "### 二进制下载" >> release_notes.md
          echo "" >> release_notes.md
          echo "| 平台 | 架构 | 文件 |" >> release_notes.md
          echo "| --- | --- | --- |" >> release_notes.md
          echo "| Linux | x86_64 | \`skyimage-${{ steps.version.outputs.version }}-linux-amd64.tar.gz\` |" >> release_notes.md
          echo "| Linux | ARM64 | \`skyimage-${{ steps.version.outputs.version }}-linux-arm64.tar.gz\` |" >> release_notes.md
          echo "| Windows | x86_64 | \`skyimage-${{ steps.version.outputs.version }}-windows-amd64.zip\` |" >> release_notes.md
          echo "| macOS | Intel | \`skyimage-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz\` |" >> release_notes.md
          echo "| macOS | Apple Silicon | \`skyimage-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz\` |" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## 发布完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**标签:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 产物" >> $GITHUB_STEP_SUMMARY
          echo "- Docker 镜像: \`${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- GHCR 镜像: \`${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 二进制文件: 5 个平台" >> $GITHUB_STEP_SUMMARY
