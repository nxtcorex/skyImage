name: Build Preview Docker Image

on:
  push:
    branches:
      - main
      - master
    # website/ 为独立官网工程，不参与镜像构建，其改动不触发本工作流
    paths-ignore:
      - 'website/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'website/**'

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/skyimage
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set GHCR image name (lowercase)
        run: echo "GHCR_IMAGE=${GHCR_IMAGE,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.31.0

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}

      - name: Compute platform suffix and commit sha
        id: platform
        run: |
          PLATFORM="${{ matrix.platform }}"
          echo "suffix=${PLATFORM//\//-}" >> $GITHUB_OUTPUT
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}
          outputs: |
            type=image,name=${{ env.DOCKER_IMAGE }}:preview-${{ steps.platform.outputs.short_sha }}-${{ steps.platform.outputs.suffix }},push=${{ github.event_name != 'pull_request' }}
            type=image,name=${{ env.GHCR_IMAGE }}:preview-${{ steps.platform.outputs.short_sha }}-${{ steps.platform.outputs.suffix }},push=${{ github.event_name != 'pull_request' }}

      - name: Export tags
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/tags/docker /tmp/tags/ghcr
          echo "${{ env.DOCKER_IMAGE }}:preview-${{ steps.platform.outputs.short_sha }}-${{ steps.platform.outputs.suffix }}" > /tmp/tags/docker/${{ steps.platform.outputs.suffix }}
          echo "${{ env.GHCR_IMAGE }}:preview-${{ steps.platform.outputs.short_sha }}-${{ steps.platform.outputs.suffix }}" > /tmp/tags/ghcr/${{ steps.platform.outputs.suffix }}

      - name: Upload tags
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: tags-${{ strategy.job-index }}
          path: /tmp/tags/*
          if-no-files-found: error
          retention-days: 1

  merge:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - name: Set GHCR image name (lowercase)
        run: echo "GHCR_IMAGE=${GHCR_IMAGE,,}" >> $GITHUB_ENV

      - name: Download tags
        uses: actions/download-artifact@v7
        with:
          path: /tmp/tags
          pattern: tags-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.31.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          SUFFIX="preview"
          if [ -n "$SHORT_SHA" ]; then
            SUFFIX="preview-${SHORT_SHA}"
          fi
          TAGS="${{ env.DOCKER_IMAGE }}:${SUFFIX},${{ env.DOCKER_IMAGE }}:preview"
          GHCR_TAGS="${{ env.GHCR_IMAGE }}:${SUFFIX},${{ env.GHCR_IMAGE }}:preview"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "ghcr_tags=${GHCR_TAGS}" >> $GITHUB_OUTPUT
          echo "version=preview-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Create Docker Hub manifest list and push
        working-directory: /tmp/tags/docker
        run: |
          TAGS_ARRAY=($(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '))
          TAG_ARGS=""
          for tag in "${TAGS_ARRAY[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $tag"
          done
          docker buildx imagetools create $TAG_ARGS $(cat *)

      - name: Create GHCR manifest list and push
        working-directory: /tmp/tags/ghcr
        run: |
          TAGS_ARRAY=($(echo "${{ steps.tags.outputs.ghcr_tags }}" | tr ',' ' '))
          TAG_ARGS=""
          for tag in "${TAGS_ARRAY[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $tag"
          done
          docker buildx imagetools create $TAG_ARGS $(cat *)

      - name: Inspect images
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:${{ steps.tags.outputs.version }}
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.version }}

      - name: Build summary
        run: |
          echo "## 预览版构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本:** ${{ steps.tags.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**标签:** ${{ steps.tags.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
