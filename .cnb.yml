# SkyImage - CNB 流水线
# 预览(main/master)与正式版(v* tag)均构建 amd64 + arm64 双架构镜像

main:
  push: &preview
    - name: 构建并推送 SkyImage amd64 预览镜像
      services:
        - docker
      ifModify:
        - "**"
        - "!(website/**)"
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      stages:
        - name: 构建并推送 amd64 镜像
          script: |
            set -eu
            SHA="$(git rev-parse --short=7 HEAD)"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build -t "${IMAGE}:preview-linux-amd64" -t "${IMAGE}:preview-${SHA}-linux-amd64" .
            docker push "${IMAGE}:preview-linux-amd64"
            docker push "${IMAGE}:preview-${SHA}-linux-amd64"
        - name: 通知 amd64 构建完成
          type: cnb:resolve
          options:
            key: skyimage-${CNB_BRANCH}-amd64

    - name: 构建并推送 SkyImage arm64 预览镜像
      services:
        - docker
      ifModify:
        - "**"
        - "!(website/**)"
      runner:
        tags: cnb:arch:arm64:v8
        cpus: 8
      stages:
        - name: 构建并推送 arm64 镜像
          script: |
            set -eu
            SHA="$(git rev-parse --short=7 HEAD)"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build -t "${IMAGE}:preview-linux-arm64" -t "${IMAGE}:preview-${SHA}-linux-arm64" .
            docker push "${IMAGE}:preview-linux-arm64"
            docker push "${IMAGE}:preview-${SHA}-linux-arm64"
        - name: 通知 arm64 构建完成
          type: cnb:resolve
          options:
            key: skyimage-${CNB_BRANCH}-arm64

    - name: 合并预览镜像多架构清单
      services:
        - docker
      ifModify:
        - "**"
        - "!(website/**)"
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      stages:
        - name: 解析提交短 SHA
          script: |
            echo -n "$(git rev-parse --short=7 HEAD)"
          exports:
            info: SHORT_SHA
        - name: 等待 amd64 构建完成
          type: cnb:await
          options:
            key: skyimage-${CNB_BRANCH}-amd64
        - name: 等待 arm64 构建完成
          type: cnb:await
          options:
            key: skyimage-${CNB_BRANCH}-arm64
        - name: 生成 preview 清单
          image: cnbcool/manifest
          settings:
            target: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:preview
            template: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:preview-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: 生成 preview-${SHORT_SHA} 清单
          image: cnbcool/manifest
          settings:
            target: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:preview-${SHORT_SHA}
            template: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:preview-${SHORT_SHA}-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: 清理中间架构标签
          type: artifact:remove-tag
          options:
            name: ${CNB_REPO_NAME}
            tags:
              - preview-linux-amd64
              - preview-linux-arm64
              - preview-${SHORT_SHA}-linux-amd64
              - preview-${SHORT_SHA}-linux-arm64
            type: docker

master:
  push: *preview

$:
  tag_push:
    - name: 构建 SkyImage amd64 版本镜像
      if: echo "$CNB_BRANCH" | grep -q '^v[0-9]'
      services:
        - docker
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      stages:
        - name: 构建并推送 amd64 镜像
          script: |
            set -eu
            VERSION="$(echo "$CNB_BRANCH" | sed 's/^v//')"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build -t "${IMAGE}:${VERSION}-linux-amd64" .
            docker push "${IMAGE}:${VERSION}-linux-amd64"
        - name: 通知 amd64 构建完成
          type: cnb:resolve
          options:
            key: skyimage-${CNB_BRANCH}-amd64

    - name: 构建 SkyImage arm64 版本镜像
      if: echo "$CNB_BRANCH" | grep -q '^v[0-9]'
      services:
        - docker
      runner:
        tags: cnb:arch:arm64:v8
        cpus: 8
      stages:
        - name: 构建并推送 arm64 镜像
          script: |
            set -eu
            VERSION="$(echo "$CNB_BRANCH" | sed 's/^v//')"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build -t "${IMAGE}:${VERSION}-linux-arm64" .
            docker push "${IMAGE}:${VERSION}-linux-arm64"
        - name: 通知 arm64 构建完成
          type: cnb:resolve
          options:
            key: skyimage-${CNB_BRANCH}-arm64

    - name: 合并多架构清单并发布 SkyImage 版本
      if: echo "$CNB_BRANCH" | grep -q '^v[0-9]'
      services:
        - docker
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      stages:
        - name: 解析版本号
          script: |
            echo -n "$(echo "$CNB_BRANCH" | sed 's/^v//')"
          exports:
            info: VERSION
        - name: 等待 amd64 构建完成
          type: cnb:await
          options:
            key: skyimage-${CNB_BRANCH}-amd64
        - name: 等待 arm64 构建完成
          type: cnb:await
          options:
            key: skyimage-${CNB_BRANCH}-arm64
        - name: 生成版本号清单
          image: cnbcool/manifest
          settings:
            target: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION}
            template: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION}-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: 生成 latest 清单
          image: cnbcool/manifest
          settings:
            target: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
            template: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION}-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: 生成更新日志
          script: |
            awk '/^## \[[0-9]/{if(f) exit} f{print} /^## \[[0-9]/{f=1}' CHANGELOG.md > LATEST_CHANGELOG.md
            cat LATEST_CHANGELOG.md
        - name: 发布 Release
          type: git:release
          options:
            latest: true
            descriptionFromFile: LATEST_CHANGELOG.md
        - name: 清理中间架构标签
          type: artifact:remove-tag
          options:
            name: ${CNB_REPO_NAME}
            tags:
              - ${VERSION}-linux-amd64
              - ${VERSION}-linux-arm64
            type: docker
