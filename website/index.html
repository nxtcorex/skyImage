    <meta

      content="SkyImage —— 现代化开源图床系统。支持多存储策略、用户组权限、数据库跨库迁移与 Lsky Pro 一键导入。" data-page-node-id="nOMsL5pwQVPEtVGhQOTKlA"
    />
    <title>SkyImage · 现代化开源图床系统</title>
    <script>
      (function () {
        try {
          var storageKey = "skyimage-theme";
          var stored = localStorage.getItem(storageKey);
          var systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : systemPrefersDark
                ? "dark"
                : "light";
          if (resolved === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          document.documentElement.style.colorScheme = resolved;

          var palette = localStorage.getItem("skyimage-theme-palette");
          var allowed = ["skyimage", "shadcn-admin", "zinc", "slate", "stone"];
          document.documentElement.dataset.palette =
            allowed.indexOf(palette) !== -1 ? palette : "skyimage";

          var lang = localStorage.getItem("skyimage-language");
          var resolvedLang =
            lang === "zh-CN" || lang === "en"
              ? lang
              : (navigator.language || "").toLowerCase().indexOf("zh") === 0
                ? "zh-CN"
                : "en";
          document.documentElement.lang = resolvedLang;
        } catch (error) {
          console.warn("theme init failed", error);
        }
      })();
    </script>
  </head>
